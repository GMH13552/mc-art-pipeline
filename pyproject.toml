[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mc-art-studio-next"
version = "0.1.0"
description = "Open-geometry Minecraft pixel-art generation pipeline"
requires-python = ">=3.12"
dependencies = ["Pillow>=12.0"]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[project.scripts]
mc-art-next = "studio_next.cli:main"

[tool.setuptools.packages.find]
include = ["studio_next*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
